services:
  - type: web
    name: pro-hiring-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_WEBHOOK_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
